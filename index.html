<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#b91c37"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="NorskStart"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>NorskStart</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f8fafc}*{box-sizing:border-box}body{margin:0;background:#f1f5f9}.app{max-width:430px;min-height:100vh;margin:auto;background:#f8fafc;padding-bottom:84px}.head{position:sticky;top:0;background:#fff;padding:max(16px,env(safe-area-inset-top)) 20px 14px;border-bottom:1px solid #eee;z-index:3}.brand{display:flex;justify-content:space-between;align-items:center}.brand b{font-size:21px}.brand small{display:block;color:#94a3b8}.stats{font-weight:800}.wrap{padding:20px}.hero{background:linear-gradient(135deg,#b91c37,#e11d48);color:#fff;border-radius:28px;padding:24px;box-shadow:0 10px 24px #e11d4830}.hero h1{font-size:26px;margin:6px 0}.btn{border:0;border-radius:16px;padding:14px 18px;font-weight:800;font-size:16px}.white{background:#fff;color:#be123c}.red{background:#be123c;color:#fff}.green{background:#10b981;color:#fff}.dark{background:#111827;color:#fff}.bar{height:12px;border-radius:99px;background:#e2e8f0;overflow:hidden}.fill{height:100%;background:#e11d48}.cards{display:grid;gap:12px;margin-top:14px}.lesson,.panel{background:#fff;border-radius:20px;padding:16px;box-shadow:0 2px 10px #0f172a0c}.lesson{display:flex;gap:14px;align-items:center}.icon{font-size:30px;width:58px;height:58px;display:grid;place-items:center;background:#fff1f2;border-radius:18px}.muted{color:#94a3b8}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);display:flex;background:#fff;border-top:1px solid #eee;padding:7px 4px max(7px,env(safe-area-inset-bottom));z-index:4}.nav button{flex:1;border:0;background:transparent;padding:8px;color:#64748b;font-weight:700}.nav button.on{color:#be123c}.flash{min-height:350px;background:#fff;border-radius:30px;padding:36px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 12px 30px #0f172a15}.flash h2{font-size:34px}.pron{background:#f1f5f9;border-radius:99px;padding:8px 13px;color:#64748b}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.answers{display:grid;gap:10px}.answer{padding:15px;border:2px solid transparent;border-radius:16px;background:white;text-align:left;font-weight:750}.answer.ok{border-color:#10b981;background:#ecfdf5}.answer.bad{border-color:#ef4444;background:#fef2f2}.topline{display:flex;justify-content:space-between;align-items:center}.hide{display:none}h2{margin-top:6px}
</style></head><body><div class="app"><header class="head"><div class="brand"><div><b>🇳🇴 NorskStart</b><small>Norwegisch für Jörg</small></div><div class="stats">🔥 3 &nbsp; ⭐ <span id="xp">0</span></div></div></header><main id="content"></main><nav class="nav"><button data-v="home" class="on">⌂<br>Start</button><button data-v="learn">▣<br>Lernen</button><button data-v="quiz">●<br>Test</button><button data-v="progress">★<br>Erfolge</button></nav></div><script>
const words=[['Hei!','Hallo!','hai'],['God morgen!','Guten Morgen!','gu morren'],['Hvordan går det?','Wie geht es dir?','wordan gor de'],['Det går bra, takk.','Mir geht es gut, danke.','de gor bra, takk'],['Hva heter du?','Wie heißt du?','wa heter dü'],['Jeg heter Jörg.','Ich heiße Jörg.','jai heter Jörg'],['Hyggelig å møte deg.','Schön, dich kennenzulernen.','hüggeli o möte dai'],['Takk!','Danke!','takk'],['Vær så snill.','Bitte.','wär so snill'],['Unnskyld.','Entschuldigung.','ünschüll'],['Jeg forstår ikke.','Ich verstehe nicht.','jai forschtohr ikke'],['Kan du snakke saktere?','Kannst du langsamer sprechen?','kann dü snakke saktere'],['Snakker du engelsk?','Sprichst du Englisch?','snakker dü engelsk'],['Hvor er toalettet?','Wo ist die Toilette?','wur är toalettet'],['Ha det bra!','Auf Wiedersehen!','ha de bra']];
let state=JSON.parse(localStorage.getItem('norskstart')||'{"known":[],"xp":0}'), view='home', idx=0, back=false, qi=0, score=0, selected=null; const $=s=>document.querySelector(s), C=$('#content');
function save(){localStorage.setItem('norskstart',JSON.stringify(state));$('#xp').textContent=state.xp} save();
function speak(t){if(!('speechSynthesis'in window))return alert('Sprachausgabe wird von diesem Browser nicht unterstützt.');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='nb-NO';u.rate=.78;speechSynthesis.speak(u)}
function go(v){view=v;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));render()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
function home(){let p=Math.round(state.known.length/words.length*100);return `<div class="wrap"><section class="hero"><small>God ettermiddag, Jörg!</small><h1>Bereit für deine Norwegenreise?</h1><p>Nur 10 Minuten täglich bringen dich weiter.</p><button class="btn white" onclick="go('learn')">Weiterlernen ›</button></section><section><div class="topline" style="margin-top:24px"><h2>Lernfortschritt</h2><b>${p}%</b></div><div class="bar"><div class="fill" style="width:${p}%"></div></div><div class="cards"><div class="lesson" onclick="go('learn')"><div class="icon">👋</div><div><small class="muted">LEKTION 1</small><b style="display:block">Die 15 wichtigsten Sätze</b><small class="muted">Begrüßen, bedanken und verständigen</small></div></div><div class="lesson" style="opacity:.5"><div class="icon">🍽️</div><div><small>LEKTION 2 · 🔒</small><b style="display:block">Im Restaurant</b></div></div><div class="lesson" style="opacity:.5"><div class="icon">🏭</div><div><small>LEKTION 3 · 🔒</small><b style="display:block">Business & Produktion</b></div></div></div></section></div>`}
function learn(){let w=words[idx];return `<div class="wrap"><div class="topline"><button class="btn" onclick="go('home')">‹</button><b>Lektion 1</b><b>${idx+1}/${words.length}</b></div><div class="bar" style="margin:15px 0 20px"><div class="fill" style="width:${(idx+1)/words.length*100}%"></div></div><div class="flash" onclick="back=!back;render()"><small class="muted">${back?'DEUTSCH':'NORSK'}</small><h2>${back?w[1]:w[0]}</h2>${back?'':`<span class="pron">Aussprache: ${w[2]}</span><button class="btn red" style="margin-top:25px" onclick="event.stopPropagation();speak('${w[0].replaceAll("'","\\'")}')">🔊 Anhören</button>`}</div><div class="row"><button class="btn" onclick="idx=Math.max(0,idx-1);back=false;render()">‹ Zurück</button><button class="btn green" onclick="known()">✓ Kann ich!</button></div></div>`}
function known(){if(!state.known.includes(idx)){state.known.push(idx);state.xp+=10;save()} if(idx<words.length-1)idx++; back=false;render()}
function opts(){let a=[words[qi][1]], pool=words.filter((_,i)=>i!==qi).map(x=>x[1]);while(a.length<4){let x=pool[Math.floor(Math.random()*pool.length)];if(!a.includes(x))a.push(x)}return a.sort(()=>Math.random()-.5)}let currentOpts=opts();
function quiz(){if(qi>=10)return `<div class="wrap"><div class="panel" style="text-align:center;margin-top:70px"><div style="font-size:70px">🏆</div><h2>Bra jobbet!</h2><p>Du hast <b>${score} von 10</b> richtig.</p><button class="btn red" onclick="qi=0;score=0;selected=null;currentOpts=opts();render()">Nochmal üben</button></div></div>`;return `<div class="wrap"><small class="muted">WISSENSCHECK</small><div class="topline"><h2>Schnelltest</h2><b>${qi+1}/10</b></div><div class="panel" style="text-align:center"><small>Was bedeutet?</small><h2>${words[qi][0]}</h2><button class="btn" onclick="speak('${words[qi][0].replaceAll("'","\\'")}')">🔊</button></div><div class="answers" style="margin-top:18px">${currentOpts.map(o=>`<button class="answer ${selected?(o===words[qi][1]?'ok':o===selected?'bad':''):''}" onclick="answer(this.textContent)">${o}</button>`).join('')}</div>${selected?'<button class="btn dark" style="width:100%;margin-top:15px" onclick="qi++;selected=null;currentOpts=qi<10?opts():[];render()">Weiter ›</button>':''}</div>`}
function answer(a){if(selected)return;selected=a;if(a===words[qi][1]){score++;state.xp+=5;save()}render()}
function progress(){let p=Math.round(state.known.length/words.length*100);return `<div class="wrap"><small class="muted">DEIN FORTSCHRITT</small><h2>Du bleibst dran!</h2><div class="cards"><div class="panel"><b style="font-size:30px">🔥 3</b><p class="muted">Tage in Folge</p></div><div class="panel"><b style="font-size:30px">⭐ ${state.xp}</b><p class="muted">XP gesammelt</p></div><div class="panel"><b>Lektion 1</b><p>${state.known.length} von ${words.length} Sätzen gelernt</p><div class="bar"><div class="fill" style="width:${p}%"></div></div></div></div></div>`}
function render(){C.innerHTML=view==='home'?home():view==='learn'?learn():view==='quiz'?quiz():progress()}render();
if('serviceWorker'in navigator) navigator.serviceWorker.register('./sw.js');
</script></body></html>
